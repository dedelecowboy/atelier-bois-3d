# Fabrique les modules à chaque modification poussée sur GitHub (ou à la demande, onglet Actions).
# Résultat : onglet Actions → dernière exécution → « Artifacts » → modules (pages web + paquetages SCORM).
# Si un fichier de données contient une erreur, l'exécution échoue et le journal indique le fichier et la ligne.
# Site public (GitHub Pages, demandé par l'enseignant le 30/10/2026) : à chaque modification de main, le dossier d'entraînement
# (dist/site : l'atelier 3D en page d'accueil, les 9 machines et les risques généraux, sans note ni Moodle) est publié sur
# https://dedelecowboy.github.io/atelier-bois-3d/ . Réglage à faire une fois : Settings → Pages → Source : « GitHub Actions ».
name: Fabrication
on:
  push:
  workflow_dispatch:
jobs:
  fabrication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: modules
          path: dist/
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site
  site:
    if: github.ref == 'refs/heads/main'
    needs: fabrication
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
