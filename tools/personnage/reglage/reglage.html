<title>Réglage des EPI</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
/* atelier : panneau de réglage à droite (gris-bleu de la veste, touche jaune des passepoils), vue 3D à gauche */
:root{ --fond:#eef0f2; --panneau:#ffffff; --texte:#1d2430; --doux:#5b6676; --trait:#d5dae1; --veste:#4d5f78; --jaune:#e2b416; --ok:#2f7d4f;
  --titre:'Barlow Condensed','Arial Narrow',sans-serif; --corps:'Barlow','Segoe UI',system-ui,sans-serif; }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --fond:#151a21; --panneau:#1d242e; --texte:#e7ebf0; --doux:#9aa6b6; --trait:#323c4a; --veste:#8ea3c2; --jaune:#e8c03a; --ok:#5dbb85; color-scheme:dark } }
:root[data-theme="dark"]{ --fond:#151a21; --panneau:#1d242e; --texte:#e7ebf0; --doux:#9aa6b6; --trait:#323c4a; --veste:#8ea3c2; --jaune:#e8c03a; --ok:#5dbb85; color-scheme:dark }
html,body{ height:100% } body{ background:var(--fond); color:var(--texte); font:15px/1.4 var(--corps); }
.app{ display:grid; grid-template-columns:minmax(0,1fr) 380px; height:100%; }
.scene{ position:relative; min-width:0 } #vue{ width:100%; height:100%; display:block }
.vues{ position:absolute; left:max(12px,env(safe-area-inset-left,0px)); bottom:12px; display:flex; flex-wrap:wrap; gap:6px }
.vues button,.btn{ font:600 14px var(--corps); border:1px solid var(--trait); background:var(--panneau); color:var(--texte); border-radius:6px; padding:7px 11px; cursor:pointer }
.vues button:hover,.btn:hover{ border-color:var(--veste) } button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{ outline:2px solid var(--jaune); outline-offset:1px }
aside{ background:var(--panneau); border-left:1px solid var(--trait); overflow:auto; padding-block:14px 20px; padding-left:16px; padding-right:max(16px,env(safe-area-inset-right,0px)); display:flex; flex-direction:column; gap:14px }
h1{ font:700 24px var(--titre); letter-spacing:.02em; margin:0; text-transform:uppercase; color:var(--veste) }
h1 span{ display:block; width:44px; height:4px; background:var(--jaune); margin-top:4px }
.choix{ display:grid; gap:8px } .choix label{ font:600 12px var(--titre); letter-spacing:.06em; text-transform:uppercase; color:var(--doux) }
select{ width:100%; font:16px var(--corps); padding:6px 8px; border-radius:6px; border:1px solid var(--trait); background:var(--fond); color:var(--texte) }
.cc{ display:flex; gap:8px; align-items:center; font-size:14px }
#etat{ font:600 12px var(--titre); letter-spacing:.06em; text-transform:uppercase; padding:3px 8px; border-radius:4px; border:1px solid var(--trait); color:var(--doux); justify-self:start }
#etat[data-regle="true"]{ color:var(--ok); border-color:var(--ok) }
fieldset{ border:1px solid var(--trait); border-radius:8px; padding:8px 10px 10px; margin:0; display:grid; gap:8px; min-width:0 }
legend{ font:700 14px var(--titre); letter-spacing:.05em; text-transform:uppercase; padding:0 4px }
.ch{ display:grid; gap:2px } .ch label{ font-size:13px; color:var(--doux) }
.lg{ display:grid; grid-template-columns:28px minmax(0,1fr) 28px 72px 22px; gap:6px; align-items:center }
.pas{ height:28px; border:1px solid var(--trait); background:var(--fond); color:var(--texte); border-radius:5px; font-size:16px; cursor:pointer }
input[type=range]{ width:100%; accent-color:var(--veste) } input[type=number]{ width:100%; font:15px var(--corps); padding:3px 5px; border:1px solid var(--trait); border-radius:5px; background:var(--fond); color:var(--texte); font-variant-numeric:tabular-nums }
.u{ font-size:12px; color:var(--doux) }
.actions{ display:flex; flex-wrap:wrap; gap:8px } .btn.fort{ background:var(--veste); color:#fff; border-color:var(--veste) }
textarea{ width:100%; min-height:90px; font:12px ui-monospace,monospace; border:1px solid var(--trait); border-radius:6px; background:var(--fond); color:var(--texte) }
#msg{ min-height:1.2em; font-size:14px; color:var(--ok) }
.aide{ font-size:13px; color:var(--doux); margin:0 }
@media (max-width:820px){ .app{ grid-template-columns:1fr; grid-template-rows:55vh auto; height:auto } aside{ border-left:0; border-top:1px solid var(--trait); padding-left:max(16px,env(safe-area-inset-left,0px)) } }
</style>
<div class="app">
  <div class="scene"><canvas id="vue" aria-label="Personnage en 3D"></canvas>
    <div class="vues"><button data-vue="face">Face</button><button data-vue="profil">Profil droit</button><button data-vue="gauche">Profil gauche</button><button data-vue="dessus">Dessus</button><button data-vue="dos">Dos</button><button data-vue="trois">3/4</button></div></div>
  <aside>
    <h1>Réglage des EPI<span></span></h1>
    <div class="choix"><label for="eleve">Élève</label><select id="eleve"></select>
      <label for="objet">Objet à régler</label><select id="objet"></select>
      <label for="pose">Pose (pour vérifier)</label><select id="pose"></select>
      <label class="cc"><input type="checkbox" id="autres"> Montrer aussi les autres objets</label>
      <span id="etat">Valeurs de départ</span></div>
    <div id="reglages"></div>
    <p class="aide">Glisser sur la vue pour tourner, molette pour zoomer. Les boutons − / + avancent de 1 (Maj : 10). Chaque élève a ses propres réglages ; tout est gardé dans ce navigateur.</p>
    <div class="actions"><button class="btn" id="depart">Revenir au départ</button><button class="btn" id="versAutre">Copier vers ses autres tenues</button></div>
    <div class="actions"><button class="btn fort" id="copier">Copier les réglages</button><button class="btn" id="coller">Coller des réglages</button></div>
    <div id="msg" role="status"></div>
    <textarea id="sortie" hidden readonly aria-label="Réglages copiés"></textarea>
    <textarea id="entree" hidden aria-label="Réglages à coller"></textarea><button class="btn" id="appliquer" hidden>Appliquer</button>
  </aside>
</div>
<!--SCRIPT-->
