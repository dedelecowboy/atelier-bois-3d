<section class="fam" data-fam="piece" data-key="piece">
      <div class="tools" id="tools">
        <button class="toggle" type="button" data-op="rot" title="Fait rouler la pièce d'un quart de tour vers le guide : à plat ↔ sur chant">¼ de tour</button><button class="toggle" type="button" data-op="flip" title="Retourne la pièce : la face du dessus passe dessous">Retourner</button><button class="toggle" type="button" data-op="end" title="Pivote la pièce bout pour bout (change le sens d'usinage par rapport au fil)">Bout pour bout</button>
        <button class="toggle" type="button" data-op="guide">Contre le guide</button><button class="toggle" type="button" data-op="mark" title="Prend la pièce en main et trace le repère : boucle de parement sur SR1, puis petit V sur l’arête SR1 / SR2">Repère au crayon</button>
        <button class="toggle" type="button" data-op="back" title="Ramène la pièce sur la table d'entrée en la soulevant, sans la faire repasser sur l'arbre">Ramener la pièce</button><button class="toggle" type="button" data-op="reset">Nouvelle pièce</button>
      </div>
    </section>
