<section class="fam" data-fam="piece" data-key="piece" data-title="Pièce">
      <div class="tools" id="tools">
        <button class="toggle" type="button" data-op="rot" title="Fait rouler la pièce d'un quart de tour : à plat ↔ sur chant">¼ de tour</button><button class="toggle" type="button" data-op="flip" title="Retourne la pièce : la face du dessus passe sur le chariot">Retourner</button><button class="toggle" type="button" data-op="end" title="Pivote la pièce : l'autre bout va vers les outils">Bout pour bout</button>
        <button class="toggle" type="button" data-op="butee" title="Pousse la pièce contre la butée de longueur (butée abaissée)">Contre la butée</button><button class="toggle" type="button" data-op="aside" title="Range la pièce du chariot dans « Pièces débitées »">Mettre de côté</button><button class="toggle" type="button" data-op="wedge" title="Retire la chute fine coincée près de la lame (scie arrêtée, capot ouvert)">Retirer la chute</button><button class="toggle" type="button" data-op="reset">Nouveau lot</button>
        <label class="ov">Dépassement au-delà du trait de scie (mm)<input class="num" id="over-n" type="number" min="-50" max="200" step="0.5"></label>
      </div>
      <p class="pmes" id="pmes"></p>
    </section>
