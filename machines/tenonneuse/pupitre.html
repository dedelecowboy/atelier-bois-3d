<span class="pup-l">Pupitre</span>
    <div class="pup-d"><output id="pupL">40</output><small>tenon mm</small></div>
    <div class="pup-d"><output id="pupE">9</output><small>ép. mm</small></div>
    <div class="pup-g">
  <button class="pup-au" id="au" type="button" aria-pressed="false" title="Arrêt d'urgence (coup de poing) : enfoncer / déverrouiller">Arrêt d'urgence</button>
  <button class="pup-stop" id="stop" type="button" title="Arrêt de tous les outils (moteurs-freins)">Arrêt</button>
  <button class="pup-m run" type="button" data-run="scie" aria-pressed="false" title="Mise en route de la scie">Scie</button>
  <button class="pup-m run" type="button" data-run="inf" aria-pressed="false" title="Mise en route du dérouleur inférieur">Dérouleur inf.</button>
  <button class="pup-m run" type="button" data-run="sup" aria-pressed="false" title="Mise en route du dérouleur supérieur">Dérouleur sup.</button>
  <button class="pup-m run" type="button" data-run="tou" aria-pressed="false" title="Mise en route de l'unité de toupillage">Toupie</button>
  <button class="pup-go" id="pass" type="button" aria-pressed="false" title="Pousse le chariot devant la scie, les dérouleurs et l'unité de toupillage">Pousser le chariot</button>
  <button class="pup-back" id="back" type="button" title="Ramène le chariot en position de chargement">Ramener</button>
    </div>
