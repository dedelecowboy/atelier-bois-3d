<span class="pup-l">Pupitre</span>
    <div class="pup-d"><output id="pupV">0</output><small>m/s</small></div>
    <div class="pup-d"><output id="pupH">0</output><small>guide mm</small></div>
    <div class="pup-g">
      <button class="pup-m" id="motor" type="button" aria-pressed="false" title="Marche (I) / arrêt (O) de la lame, frein automatique à l'arrêt">I · Lame</button>
      <button class="pup-au" id="au" type="button" aria-pressed="false" title="Arrêt d'urgence (coup de poing) : enfoncer / déverrouiller">Arrêt d'urgence</button>
      <button class="pup-go" id="feed" type="button" aria-pressed="false" title="Pousse la pièce vers la lame (marche / arrêt)">Avance</button>
      <button class="pup-s" id="left" type="button" title="Tourne la pièce vers la gauche (vue de dessus), pendant l'avance (touche ←)">↺</button>
      <button class="pup-s" id="right" type="button" title="Tourne la pièce vers la droite (vue de dessus), pendant l'avance (touche →)">↻</button>
      <button class="pup-s" id="back" type="button" title="Maintenir : recule la pièce (lame à l'arrêt complet dans une courbe)">Reculer</button>
      <button class="pup-p" id="pouss" type="button" aria-pressed="false" title="Prendre le poussoir pour la fin de passe">Poussoir</button>
    </div>
