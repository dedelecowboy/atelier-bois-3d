<section class="fam" data-fam="piece" data-key="piece">
      <div class="tools" id="tools">
        <button class="toggle" type="button" data-op="trace" title="Amène le départ du tracé devant la lame, le tracé dans l'axe d'avance">Au départ du tracé</button><button class="toggle" type="button" data-op="fence" title="Pose la pièce contre le guide parallèle, prête à avancer">Contre le guide</button><button class="toggle" type="button" data-op="chant" title="Pose la pièce sur son chant (refente) ou à plat">Sur chant / à plat</button>
        <button class="toggle" type="button" data-op="miter" title="Pose la pièce contre le guide d'onglet">Au guide d'onglet</button><button class="toggle" type="button" data-op="gab" title="Pose la pièce ronde dans le gabarit en vé, au droit de la lame">Dans le gabarit</button><button class="toggle" type="button" data-op="reject" title="Pièce ronde : ne se scie pas tenue à la main. Mise de côté pour un gabarit">Écarter : gabarit</button>
        <button class="toggle" type="button" data-op="evac" title="Retire à la main les chutes de la table (lame à l'arrêt complet si une chute est contre la lame)">Évacuer les chutes</button><button class="toggle" type="button" data-op="pchute" title="Pousse les chutes loin de la lame avec le poussoir (possible lame en marche)">Dégager au poussoir</button><button class="toggle" type="button" data-op="aside" title="Range les pièces de la table dans les pièces débitées">Mettre de côté</button>
      </div>
      <div class="nudge" id="nudge"><span class="nudge-l">Déplacer la pièce, lame hors du bois (mm)</span><button class="toggle" type="button" data-op="xm1">← 1</button><button class="toggle" type="button" data-op="xp1">1 →</button><button class="toggle" type="button" data-op="zm10">Approcher 10</button><button class="toggle" type="button" data-op="zp10">Éloigner 10</button><button class="toggle" type="button" data-op="reset">Nouvelle pièce</button></div>
      <svg class="plan-svg" id="planSvg" viewBox="0 0 320 180" role="img" aria-label="Vue de dessus autour de la lame : pièce, tracé, trait de scie, guide"></svg>
    </section>
