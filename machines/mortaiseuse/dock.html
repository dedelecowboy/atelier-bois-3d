<section class="fam" data-fam="piece" data-key="piece" data-title="Pièce">
      <div class="tools" id="tools">
        <button class="toggle" type="button" data-op="left" title="Pousse la pièce contre la butée gauche (butée abaissée), contre le guide">Contre la butée gauche</button><button class="toggle" type="button" data-op="right" title="Pousse la pièce contre la butée droite (butée abaissée), contre le guide">Contre la butée droite</button>
        <button class="toggle" type="button" data-op="rot" title="Fait rouler la pièce d'un quart de tour : à plat ↔ sur chant">¼ de tour</button><button class="toggle" type="button" data-op="flip" title="Retourne la pièce : la face du dessus passe sur la table">Retourner</button><button class="toggle" type="button" data-op="end" title="Pivote la pièce : l'autre bout va à gauche (le chant avant passe contre le guide)">Bout pour bout</button>
        <button class="toggle" type="button" data-op="peek" aria-pressed="false" title="Soulève la pièce devant la machine, la face usinée vers vous, pour regarder les mortaises (puis la repose)">Voir les mortaises</button><button class="toggle" type="button" data-op="aside" title="Range la pièce de la table dans « Pièces débitées »">Mettre de côté</button><button class="toggle" type="button" data-op="reset">Nouveau lot</button>
      </div>
      <p class="pmes" id="pmes"></p>
    </section>
