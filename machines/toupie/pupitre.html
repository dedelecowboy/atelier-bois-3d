<span class="pup-l">Pupitre</span>
    <div class="pup-d"><output id="pupH">0,0</output><small>h mm</small></div>
    <div class="pup-d"><output id="pupN">0</output><small>tr/min</small></div>
    <div class="pup-g">
      <button class="pup-m" id="motor" type="button" aria-pressed="false" title="Marche (I) / arrêt (O) du moteur de l'arbre, frein à l'arrêt">I · Moteur</button>
      <button class="pup-au" id="au" type="button" aria-pressed="false" title="Arrêt d'urgence (coup de poing) : enfoncer / réarmer">Arrêt d'urgence</button>
      <button class="pup-m" id="entrOn" type="button" aria-pressed="false" title="Marche / arrêt de l'entraîneur (après l'arbre)">I · Entraîneur</button>
      <button class="pup-go" id="pass" type="button" aria-pressed="false" title="Pousse la pièce de droite à gauche le long du guide, contre la rotation de l'outil">Passer la pièce</button>
    </div>
