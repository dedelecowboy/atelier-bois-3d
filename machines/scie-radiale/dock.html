<section class="fam" data-fam="piece" data-key="piece">
      <div class="tools" id="tools">
        <button class="toggle" type="button" data-op="guide">Contre le guide</button><button class="toggle" type="button" data-op="end" title="Pivote la pièce : l'autre bout passe à droite, côté lame">Bout pour bout</button><button class="toggle" type="button" data-op="evac" title="Retire de la table toutes les pièces sauf celle entourée en orange (cliquez une pièce pour la garder)">Évacuer les chutes</button>
        <button class="toggle" type="button" data-op="back" title="Pousse la pièce gardée contre le guide, et contre la butée si elle est en service">Mettre la pièce en butée</button><button class="toggle" type="button" data-op="aside" title="Range les pièces de la table dans les pièces débitées">Mettre de côté</button><button class="toggle" type="button" data-op="reset">Nouvelle pièce</button>
      </div>
      <div class="nudge" id="nudge"><span class="nudge-l">Faire glisser la pièce le long du guide (mm)</span><button class="toggle" type="button" data-op="xm100">Servante 100</button><button class="toggle" type="button" data-op="xm10">Servante 10</button><button class="toggle" type="button" data-op="xm1">Servante 1</button><button class="toggle" type="button" data-op="xp1">Butée 1</button><button class="toggle" type="button" data-op="xp10">Butée 10</button><button class="toggle" type="button" data-op="xp100">Butée 100</button></div>
      <svg class="plan-svg" id="planSvg" viewBox="0 0 320 172" role="img" aria-label="Vue de dessus de la table : planche, défauts, trait de scie, zone dangereuse, main de maintien et butée"></svg>
    </section>
