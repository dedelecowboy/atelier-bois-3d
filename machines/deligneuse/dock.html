<section class="fam" data-fam="piece" data-key="piece">
      <div class="tools" id="tools">
        <button class="toggle" type="button" data-op="flip" title="Retourne la pièce : la face du dessus passe sur le tapis">Retourner</button><button class="toggle" type="button" data-op="end" title="Pivote la pièce : l'autre bout entre en premier">Bout pour bout</button><button class="toggle" type="button" data-op="guide">Contre le guide</button>
        <button class="toggle" type="button" data-op="evac" title="Retire de la sortie toutes les pièces sauf celle entourée en orange (cliquez une pièce pour la garder)">Évacuer les chutes</button><button class="toggle" type="button" data-op="back" title="Ramène la pièce gardée sur la table d'entrée pour une nouvelle passe">Ramener la pièce</button><button class="toggle" type="button" data-op="aside" title="Range la pièce dans les pièces débitées et libère la machine">Mettre de côté</button><button class="toggle" type="button" data-op="reset">Nouvelle pièce</button>
      </div>
      <div class="nudge" id="nudge"><span class="nudge-l">Décaler la pièce en travers (mm)</span><button class="toggle" type="button" data-op="zm10">Guide 10</button><button class="toggle" type="button" data-op="zm1">Guide 1</button><button class="toggle" type="button" data-op="zp1">Pupitre 1</button><button class="toggle" type="button" data-op="zp10">Pupitre 10</button></div>
      <svg class="plan-svg" id="planSvg" viewBox="0 0 320 166" role="img" aria-label="Vue de dessus de la pièce sur la table d'entrée : faces, flache, traits de scie et guide"></svg>
    </section>
